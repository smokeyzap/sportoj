              schema:
                $ref: '#/components/schemas/NextActionResponse'
        '409':
          description: Er bestaat al een actief programma.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    error:
                      code: ACTIVE_PROGRAM_EXISTS
                      message: Er bestaat al een actief programma.
        '422':
          description: Ongeldige startpositie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    error:
                      code: INVALID_START_POSITION
                      message: Ongeldige startpositie.
        '419':
          description: CSRF-token ongeldig of verlopen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    error:
                      code: CSRF_MISMATCH
                      message: CSRF-token ongeldig of verlopen.
        '401':
          description: Niet ingelogd of sessie verlopen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    error:
                      code: UNAUTHENTICATED
                      message: Niet ingelogd of sessie verlopen.
