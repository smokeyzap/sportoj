        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotesRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '403':
          description: Geen toegang tot deze sessie.
          content:
            application/json:
