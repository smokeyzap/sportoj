        '419':
          description: CSRF-token ongeldig of verlopen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    error:
                      code: CSRF_MISMATCH
                      message: CSRF-token ongeldig of verlopen.
        '401':
          description: Niet ingelogd of sessie verlopen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
