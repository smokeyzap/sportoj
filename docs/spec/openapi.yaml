                      code: INVALID_SESSION_STATE
                      message: Sessie kan niet worden afgerond.
        '401':
          description: Niet ingelogd of sessie verlopen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    error:
                      code: UNAUTHENTICATED
                      message: Niet ingelogd of sessie verlopen.
        '419':
          description: CSRF-token ongeldig of verlopen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    error:
                      code: CSRF_MISMATCH
                      message: CSRF-token ongeldig of verlopen.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: training_session
      description: Opaque sessietoken. Alleen de hash wordt server-side opgeslagen.
  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
      description: CSRF-token uit login of GET /api/v1/auth/csrf.
    AssignmentId:
      name: assignment_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
    BlockId:
      name: block_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
    WorkoutId:
      name: workout_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          examples:
          - BLOCK_NOT_COMPLETED
        message:
          type: string
        details:
          type:
          - object
          - 'null'
          additionalProperties: true
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
    User:
      type: object
      required:
      - id
      - name
      - email
      - timezone
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        timezone:
          type: string
          examples:
          - Europe/Amsterdam
    UserResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/User'
    CsrfResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - csrf_token
          properties:
            csrf_token:
              type: string
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
    LoginResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - user
          - csrf_token
          properties:
            user:
              $ref: '#/components/schemas/User'
            csrf_token:
              type: string
    UpdateMeRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        timezone:
          type: string
          minLength: 1
          maxLength: 64
    Exercise:
      type: object
      required:
      - id
      - sequence
      - name
      properties:
        id:
          type: string
        sequence:
          type: integer
          minimum: 1
        name:
          type: string
        sets:
          type:
          - integer
          - 'null'
          minimum: 1
        reps:
          type:
          - integer
          - 'null'
          minimum: 1
        duration_seconds:
          type:
          - integer
          - 'null'
          minimum: 1
        notes:
          type:
          - string
          - 'null'
    WorkoutSummary:
      type: object
      required:
      - id
      - name
      - category
      - category_label
      - protocol_type
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        category_label:
          type: string
        protocol_type:
          type: string
          enum:
          - standard
          - amrap
          - countdown
          - tabata
          - circuit
        video_url:
          type:
          - string
          - 'null'
          format: uri
    WorkoutDetail:
      allOf:
      - $ref: '#/components/schemas/WorkoutSummary'
      - type: object
        required:
        - protocol_config
        - exercises
        properties:
          instructions:
            type:
            - string
            - 'null'
          protocol_config:
            type: object
            additionalProperties: true
          exercises:
            type: array
            items:
              $ref: '#/components/schemas/Exercise'
    BlockSummary:
      type: object
      required:
      - id
      - name
      - sequence
      - default_cycle_count
      - target_cycles
      - status
      properties:
        id:
          type: string
        name:
          type: string
        sequence:
          type: integer
          minimum: 1
        original_week_start:
          type: integer
        original_week_end:
          type: integer
        default_cycle_count:
          type: integer
          minimum: 1
        target_cycles:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - prior_to_start
          - not_started
          - active
          - decision_required
          - completed
    AssignmentSummary:
      type: object
      required:
      - id
      - cycle
      - position
      - day_label
      - status
      - is_extra_cycle
      - workout
      - block
      properties:
        id:
          type: string
        cycle:
          type: integer
          minimum: 1
        position:
          type: integer
          minimum: 1
          maximum: 6
        day_label:
          type: string
          enum:
          - maandag
          - dinsdag
          - woensdag
          - donderdag
          - vrijdag
          - zaterdag
        program_week:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 14
          description: Alleen voor standaardcycli. Null voor extra cycli.
        status:
          type: string
          enum:
          - pending
          - started
          - completed
          - skipped
          - prior_to_start
        is_extra_cycle:
          type: boolean
        block:
          $ref: '#/components/schemas/BlockSummary'
        workout:
          $ref: '#/components/schemas/WorkoutSummary'
    AssignmentDetail:
      allOf:
      - $ref: '#/components/schemas/AssignmentSummary'
      - type: object
        required:
        - workout_detail
        properties:
          started_at:
            type:
            - string
            - 'null'
            format: date-time
          completed_at:
            type:
            - string
            - 'null'
            format: date-time
          skipped_at:
            type:
            - string
            - 'null'
            format: date-time
          workout_detail:
            $ref: '#/components/schemas/WorkoutDetail'
    Progress:
      type: object
      required:
      - block_number
      - block_count
      - cycle
      - target_cycles
      - processed
      - total
      - completed
      - skipped
      - pending
      properties:
        block_number:
          type: integer
        block_count:
          type: integer
        cycle:
          type: integer
        target_cycles:
          type: integer
        processed:
          type: integer
        total:
          type: integer
        completed:
          type: integer
        skipped:
          type: integer
        pending:
          type: integer
    WorkoutAction:
      type: object
      required:
      - type
      - assignment
      - progress
      properties:
        type:
          type: string
          enum:
          - workout
          - resume_workout
        reason:
          type: string
        assignment:
          $ref: '#/components/schemas/AssignmentSummary'
        progress:
          $ref: '#/components/schemas/Progress'
    OnboardingAction:
      type: object
      required:
      - type
      - program
      properties:
        type:
          const: onboarding
        program:
          type: object
          required:
          - id
          - name
          - version
          properties:
            id:
              type: string
            name:
              type: string
            version:
              type: string
            original_weeks:
              type: integer
              const: 14
    ContinuationDecisionAction:
      type: object
      required:
      - type
      - source_assignment
      - options
      properties:
        type:
          const: continuation_decision
        source_assignment:
          $ref: '#/components/schemas/AssignmentSummary'
        options:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: string
            enum:
            - program_sequence
            - last_workout_sequence
    BlockDecisionAction:
      type: object
      required:
      - type
      - block
      - summary
      - options
      properties:
        type:
          const: block_decision
        block:
          $ref: '#/components/schemas/BlockSummary'
        summary:
          type: object
          required:
          - completed
          - skipped
          - cycles_processed
          properties:
            completed:
              type: integer
            skipped:
              type: integer
            cycles_processed:
              type: integer
        options:
          type: array
          items:
            type: string
            enum:
            - extend
            - advance
            - complete_program
    ProgramCompletedAction:
      type: object
      required:
      - type
      - user_program_id
      - completed_at
      properties:
        type:
          const: program_completed
        user_program_id:
          type: string
        completed_at:
          type: string
          format: date-time
    NextAction:
      oneOf:
      - $ref: '#/components/schemas/OnboardingAction'
      - $ref: '#/components/schemas/WorkoutAction'
      - $ref: '#/components/schemas/ContinuationDecisionAction'
      - $ref: '#/components/schemas/BlockDecisionAction'
      - $ref: '#/components/schemas/ProgramCompletedAction'
      discriminator:
        propertyName: type
    NextActionResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/NextAction'
    StartProgramRequest:
      type: object
      required:
      - start_mode
      properties:
        start_mode:
          type: string
          enum:
          - beginning
          - position
        original_week:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 14
        day_sequence:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 6
      allOf:
      - if:
          properties:
            start_mode:
              const: position
        then:
          required:
          - original_week
          - day_sequence
    ContinuationRequest:
      type: object
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - program_sequence
          - last_workout_sequence
    NotesRequest:
      type: object
      properties:
        notes:
          type:
          - string
          - 'null'
          maxLength: 5000
    WorkoutSession:
      type: object
      required:
      - id
      - session_type
      - status
      - workout
      - started_at
      properties:
        id:
          type: string
        session_type:
          type: string
          enum:
          - program
          - extra
        status:
          type: string
          enum:
          - started
          - completed
          - cancelled
        workout:
          $ref: '#/components/schemas/WorkoutSummary'
        assignment_id:
          type:
          - string
          - 'null'
        started_at:
          type: string
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        notes:
          type:
          - string
          - 'null'
    SessionResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/WorkoutSession'
    MutationWithNextResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - assignment
          - next_action
          properties:
            assignment:
              $ref: '#/components/schemas/AssignmentSummary'
            session:
              oneOf:
              - $ref: '#/components/schemas/WorkoutSession'
              - type: 'null'
            next_action:
              $ref: '#/components/schemas/NextAction'
    ProgramState:
      type: object
      required:
      - id
      - program
      - status
      - continuation_mode
      - blocks
      properties:
        id:
          type: string
        program:
          type: object
          required:
          - id
          - name
          - version
          properties:
            id:
              type: string
            name:
              type: string
            version:
              type: string
        status:
          type: string
          enum:
          - active
          - paused
          - completed
        continuation_mode:
          type: string
          enum:
          - program_sequence
          - last_workout_sequence
        blocks:
          type: array
          items:
            type: object
            required:
            - block
            - cycles
            properties:
              block:
                $ref: '#/components/schemas/BlockSummary'
              cycles:
                type: array
                items:
                  type: object
                  required:
                  - number
                  - is_extra
                  - assignments
                  properties:
                    number:
                      type: integer
                    is_extra:
                      type: boolean
                    assignments:
                      type: array
                      items:
                        $ref: '#/components/schemas/AssignmentSummary'
    ProgramStateResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/ProgramState'
    HistoryItem:
      type: object
      required:
      - event_type
      - occurred_at
      - workout
      properties:
        event_type:
          type: string
          enum:
          - completed
          - skipped
          - extra_completed
        occurred_at:
          type: string
          format: date-time
        workout:
          $ref: '#/components/schemas/WorkoutSummary'
        block:
          oneOf:
          - $ref: '#/components/schemas/BlockSummary'
          - type: 'null'
        cycle:
          type:
          - integer
          - 'null'
        assignment_id:
          type:
          - string
          - 'null'
        session_id:
          type:
          - string
          - 'null'
        notes:
          type:
          - string
          - 'null'
    HistoryResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HistoryItem'
        meta:
          type: object
          required:
          - page
          - per_page
          - total
          - last_page
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            last_page:
              type: integer
    WorkoutResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/WorkoutDetail'
    AssignmentResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/AssignmentDetail'
