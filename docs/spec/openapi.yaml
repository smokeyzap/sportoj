openapi: 3.1.0
info:
  title: Trainingsapp API
  version: 1.0.0
  description: Bindend API-contract voor de tijdelijke PHP backend, de Lovable frontend en de latere Laravel drop-in
    replacement.
servers:
- url: https://api.example.nl
  description: Productie, vervang via environment configuratie
- url: http://localhost:8080
  description: Lokale ontwikkeling
tags:
- name: System
- name: Auth
- name: Me
- name: Program
- name: Assignments
- name: Workouts
- name: Sessions
paths:
  /health:
    get:
      tags:
      - System
      summary: Health check
      operationId: health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: ok
                  schema_version:
                    type: string
                  dataset_version:
                    type: string
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Login en maak websessie
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: E-mailadres of wachtwoord is onjuist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    error:
                      code: INVALID_CREDENTIALS
                      message: E-mailadres of wachtwoord is onjuist.
        '429':
          description: Te veel loginpogingen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    error:
                      code: RATE_LIMITED
                      message: Te veel loginpogingen.
  /api/v1/auth/csrf:
    get:
      tags:
      - Auth
      summary: Roteer en retourneer CSRF-token voor bestaande sessie
      operationId: csrf
      security:
      - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
        '401':
          description: Niet ingelogd.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    error:
                      code: UNAUTHENTICATED
                      message: Niet ingelogd.
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Beëindig huidige websessie
      operationId: logout
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Uitgelogd.
        '401':
          description: Niet ingelogd.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    error:
                      code: UNAUTHENTICATED
                      message: Niet ingelogd.
        '419':
          description: CSRF-token ongeldig of verlopen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    error:
                      code: CSRF_MISMATCH
                      message: CSRF-token ongeldig of verlopen.
  /api/v1/me:
    get:
      tags:
      - Me
      summary: Huidige gebruiker
      operationId: getMe
      security:
      - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Niet ingelogd.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    error:
                      code: UNAUTHENTICATED
                      message: Niet ingelogd.
    patch:
      tags:
      - Me
      summary: Wijzig naam of timezone
      operationId: updateMe
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Niet ingelogd.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    error:
                      code: UNAUTHENTICATED
                      message: Niet ingelogd.
        '419':
          description: CSRF-token ongeldig of verlopen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    error:
                      code: CSRF_MISMATCH
                      message: CSRF-token ongeldig of verlopen.
        '422':
          description: Validatiefout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Validatiefout.
  /api/v1/me/program/start:
    post:
      tags:
      - Program
      summary: Start trainingsprogramma
      operationId: startProgram
      security:
