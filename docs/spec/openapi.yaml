  /api/v1/workout-sessions/{session_id}/complete:
    post:
      tags:
      - Sessions
      summary: Rond vrijwillige extra workout af
      operationId: completeExtraWorkout
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/CsrfHeader'
